body{background:#e9e5dc radial-gradient(circle at 1px 1px,#d8d2c4 1px,transparent 1.5px) 0 0/14px 14px}

#hd .r small{font-size:10.5px;letter-spacing:.12em;opacity:.8;margin-bottom:3px}
#hd .r span{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
#tbar{height:7px;background:#ece8df;border-radius:4px;overflow:hidden}

.tl.ans{outline:4px solid var(--ok);outline-offset:-4px;animation:ans .7s ease-in-out infinite alternate;z-index:2}

#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;z-index:5}

#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1eee7;z-index:4}
.spin{width:34px;height:34px;border:4px solid #d9d3c6;border-top-color:var(--pur);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#ft .ic button:active{background:#0000000f}
#tsec{flex:1;font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
#tsec.hot{color:var(--ng)}

#recBox{margin-top:12px}

.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}.tabs button{padding:7px 18px;border-radius:16px;font-weight:800;font-size:13.5px;box-shadow:inset 0 0 0 2px var(--line)}.tabs button.on{background:var(--ink);color:#fff;box-shadow:none}

    box.innerHTML = rows.length ? '<table class="rk">' + rows.map(r => `<tr${r.id === me ? ' class="me"' : ''}><td class="r">${r.rk}</td><td class="n">${esc(String(r.n))}</td><td class="c">${T.rowS(r.k, (r.t / 10).toFixed(1))}</td></tr>`).join('') + '</table>' : '<p class="note">' + T.empty + '</p>';
  } catch (e) { if (RKS === my) box.innerHTML = '<p class="note err">' + T.rankErr + '</p>'; }
}
$('rkBtn').onclick = () => openRank('d', 'title');
$('rkBtn2').onclick = () => openRank('d', 'result');
$('rkBack').onclick = () => { $('rank').hidden = true; if (RKS.from === 'result' && LAST) $('result').hidden = false; else $('title').hidden = false; };
$('nm').value = ls.get('rb_name', '');
$('recBtn').onclick = async () => {
  const nm = $('nm').value.trim(), note = $('recNote'); note.className = 'note';
  if (!nm) { note.textContent = T.needName; note.className = 'note err'; return; }
  if (badName(nm)) { note.textContent = T.badName; note.className = 'note err'; return; }
  ls.set('rb_name', nm); $('recBtn').disabled = true; note.textContent = T.sending;
  try { note.textContent = T.recPre + await submit(nm); note.className = 'note ok'; }
  catch (e) { note.textContent = e.message === 'norun' ? T.norun : T.sendErr; note.className = 'note err'; if (e.message !== 'norun') $('recBtn').disabled = false; }
};
setLang(pickLang());
if (/[?&]dev=1/.test(location.search)) window.__RB = { get S() { return S; }, get LAST() { return LAST; }, maskOf, judge, seqOf, realRec, pname, board, submit };
</script>
