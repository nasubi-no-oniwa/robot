# admin/req.json を上げると、ランキングを調べたりバンしたりする
name: ランキングの管理（調べる・バン）
on:
  push:
    branches: [main]
    paths:
      - 'admin/req.json'
  workflow_dispatch:
concurrency:
  group: robot-admin
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 道具を入れる
        run: mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && npm init -y >/dev/null && npm i google-auth-library@9 --silent
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FT_BLUE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FT_BLUE_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: ルールを反映
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node admin/run.mjs
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
